<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور | حاضنة المبادرات النوعية بالثانوية الرابعة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        brand: { dark:'#1D4A44', brown:'#B58255', beige:'#E6DBC6', midgreen:'#418378', maroon:'#B22B38', cream:'#F7F6F1' }
      }, fontFamily: { cairo:['Cairo','sans-serif'] } } }
    }
  </script>
</head>
<body class="min-h-screen bg-brand-cream text-slate-800 flex flex-col items-center justify-center p-4" style="font-family:Cairo,sans-serif">
  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-brand-beige overflow-hidden">
    <header class="bg-brand-dark p-6 text-center text-white">
      <div class="w-16 h-16 bg-white p-2 rounded-2xl mx-auto mb-3 flex items-center justify-center">
        <img src="logo.png" alt="شعار الثانوية الرابعة" class="max-h-full max-w-full object-contain">
      </div>
      <h1 class="text-lg font-black">إعادة تعيين كلمة المرور</h1>
      <p class="text-xs text-brand-beige/80 mt-1">حاضنة المبادرات النوعية بالثانوية الرابعة</p>
    </header>

    <section class="p-6 space-y-4">
      <div id="status" class="hidden p-3 rounded-xl text-xs font-bold"></div>

      <form id="resetForm" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-brand-dark mb-1">كلمة المرور الجديدة</label>
          <input id="newPassword" type="password" minlength="6" required class="w-full px-4 py-3 bg-brand-cream border border-brand-beige rounded-xl outline-none focus:border-brand-brown" placeholder="أدخل كلمة المرور الجديدة">
        </div>
        <div>
          <label class="block text-xs font-bold text-brand-dark mb-1">تأكيد كلمة المرور</label>
          <input id="confirmPassword" type="password" minlength="6" required class="w-full px-4 py-3 bg-brand-cream border border-brand-beige rounded-xl outline-none focus:border-brand-brown" placeholder="أعد إدخال كلمة المرور">
        </div>
        <button type="submit" class="w-full py-3 bg-brand-brown hover:bg-[#a17045] text-white font-black rounded-xl shadow">
          حفظ كلمة المرور الجديدة
        </button>
      </form>

      <a id="backLogin" href="login.html" class="hidden text-center text-xs text-brand-brown font-bold hover:underline">العودة إلى صفحة الدخول</a>
    </section>
  </main>

  <script>
    window.__SCHOOL_SUPABASE_CLIENT__ = window.__SCHOOL_SUPABASE_CLIENT__ || window.supabase.createClient(
      window.SUPABASE_CONFIG.url,
      window.SUPABASE_CONFIG.publishableKey
    );

    const statusEl = document.getElementById('status');
    const form = document.getElementById('resetForm');
    const backLogin = document.getElementById('backLogin');

    function showStatus(message, type='error') {
      statusEl.textContent = message;
      statusEl.className = type === 'success'
        ? 'p-3 rounded-xl text-xs font-bold bg-brand-midgreen/15 text-brand-midgreen border border-brand-midgreen/30 block'
        : 'p-3 rounded-xl text-xs font-bold bg-brand-maroon/15 text-brand-maroon border border-brand-maroon/30 block';
    }

    async function initRecovery() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (code) {
          const { error } = await window.__SCHOOL_SUPABASE_CLIENT__.auth.exchangeCodeForSession(code);
          if (error) throw error;
        }

        const { data: { session } } = await window.__SCHOOL_SUPABASE_CLIENT__.auth.getSession();
        if (!session) {
          showStatus('رابط إعادة التعيين غير صالح أو منتهي الصلاحية. أرسل رابطًا جديدًا من Supabase.');
          backLogin.classList.remove('hidden');
          return;
        }

        form.classList.remove('hidden');
        backLogin.classList.remove('hidden');
      } catch (error) {
        console.error('Recovery initialization:', error);
        showStatus('تعذر فتح جلسة إعادة التعيين. أرسل رابطًا جديدًا وحاول مرة أخرى.');
        backLogin.classList.remove('hidden');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1.length < 6) return showStatus('كلمة المرور يجب ألا تقل عن 6 أحرف.');
      if (p1 !== p2) return showStatus('تأكيد كلمة المرور غير مطابق.');

      try {
        const { error } = await window.__SCHOOL_SUPABASE_CLIENT__.auth.updateUser({ password: p1 });
        if (error) throw error;

        showStatus('تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بالكلمة الجديدة.', 'success');
        form.classList.add('hidden');
        await window.__SCHOOL_SUPABASE_CLIENT__.auth.signOut();
      } catch (error) {
        console.error('Recovery password update:', error);
        showStatus(`تعذر حفظ كلمة المرور: ${error?.message || error}`);
      }
    });

    window.__SCHOOL_SUPABASE_CLIENT__.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        form.classList.remove('hidden');
        backLogin.classList.remove('hidden');
      }
    });

    initRecovery();
  </script>
  <!-- التذييل الموحد للمنصة -->
  <footer class="bg-brand-dark text-white border-t border-white/10 mt-16 py-6 no-print">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
      <div class="flex flex-wrap items-center justify-center gap-2 text-xs font-bold text-brand-beige">
        <span>الثانوية الرابعة بالجبيل</span>
        <span>•</span>
        <span>حاضنة المبادرات النوعية بالثانوية الرابعة</span>
        <span>•</span>
        <span>مديرة المدرسة: فريدة بنت سعود العتيبي</span>
      </div>
      <div class="pt-1 flex flex-wrap items-center justify-center gap-2 text-[10px] text-white/45">
        <span>تم الإعداد والتصميم بواسطة: أوس للخدمات التقنية</span>
        <span>•</span>
        <a href="https://wa.me/970568368357" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-white/55 hover:text-white transition" title="التواصل عبر واتساب">
          <i class="fa-brands fa-whatsapp text-[11px]"></i>
          <span>واتساب</span>
        </a>
      </div>
    </div>
  </footer>

</body>
</html>
